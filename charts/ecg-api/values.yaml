# Valeurs par défaut du chart. Chaque environnement les surcharge dans deploy/envs/<env>/values.yaml.

replicaCount: 2

image:
  repository: ghcr.io/eya-lakhal/ecg-api
  # Vide = appVersion du Chart.yaml. En GitOps, la CI écrit ici un tag immuable (sha-xxxxxxx).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # L'API n'appelle pas l'API Kubernetes : pas de jeton monté dans le Pod.
  automount: false

podAnnotations: {}
podLabels: {}

# Sécurité au niveau du Pod : cohérente avec l'image (UID/GID 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Sécurité au niveau du conteneur : système de fichiers en lecture seule, aucune capability.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

containerPort: 8000

env:
  TORCH_NUM_THREADS: "1"

# Requests = ce que le scheduler réserve (et la base du calcul du HPA en Phase 6).
# Limits = plafond ; dépasser la mémoire => OOMKilled.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# startupProbe : laisse jusqu'à 60 s à torch pour s'importer avant d'activer les autres sondes.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  failureThreshold: 30

# livenessProbe : en échec => le conteneur est redémarré.
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# readinessProbe : en échec => le Pod est retiré du Service (plus de trafic), sans redémarrage.
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# Déploiement progressif sans perte de capacité : un Pod en plus, jamais un Pod en moins.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# --- Observabilité (nécessite les CRD de kube-prometheus-stack) ----------------------------
serviceMonitor:
  enabled: false
  interval: 15s

slo:
  # PrometheusRule : règles d'enregistrement SLI + alertes de burn rate.
  enabled: false
  # Objectif de disponibilité de POST /predict (fenêtre glissante de 30 jours).
  objective: 0.99
  # Label utilisé par Alertmanager pour router les alertes vers Discord.
  team: ecg
  latencyThresholdSeconds: 0.5

dashboard:
  # ConfigMap détectée par le sidecar Grafana (label grafana_dashboard=1).
  enabled: false

# --- Autoscaling (Phase 6, nécessite metrics-server) ----------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  # Pourcentage des requests CPU (250m par défaut) au-delà duquel on ajoute des Pods.
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 120

# --- Déploiement progressif (Phase 7, nécessite Argo Rollouts) ------------------------------
rollout:
  enabled: false
  # Paliers de la progression canary (une pause sans durée attendrait une promotion manuelle).
  steps:
    - setWeight: 25
    - pause: { duration: 2m }
    - setWeight: 50
    - pause: { duration: 2m }
    - setWeight: 75
    - pause: { duration: 1m }
  analysis:
    prometheusAddress: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
    # Le Pod canary met ~60 s à démarrer (import de torch), puis il faut au moins 2 collectes
    # Prometheus (15 s) dans la fenêtre de rate() : avant 2 min 30, les requêtes renvoient « pas
    # de données » ou NaN (0/0), ce qui faisait échouer à tort la première analyse.
    initialDelay: 2m30s
    interval: 30s
    # Une mesure isolée hors seuil ne suffit pas à annuler ; deux consécutives, si.
    failureLimit: 1
    minConfidence: 0.6

# Chaos engineering : fraction des requêtes /predict qui renvoient volontairement 500.
faultRate: "0"

nodeSelector: {}
tolerations: []
affinity: {}
