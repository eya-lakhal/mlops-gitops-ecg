{{- if .Values.serviceMonitor.enabled }}
# Indique à Prometheus Operator de scraper /metrics sur chaque Pod derrière le Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ecg-api.fullname" . }}
  labels:
    {{- include "ecg-api.labels" . | nindent 4 }}
spec:
  # Copie ce label de Pod sur chaque métrique : l'analyse canary (Phase 7) peut ainsi
  # comparer les Pods de la nouvelle version à ceux de la version stable.
  podTargetLabels:
    - rollouts-pod-template-hash
  selector:
    matchLabels:
      {{- include "ecg-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
