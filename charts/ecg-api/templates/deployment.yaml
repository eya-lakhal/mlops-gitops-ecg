{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecg-api.fullname" . }}
  labels:
    {{- include "ecg-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Avec un HPA, le nombre de réplicas n'est PAS déclaré ici : sinon ArgoCD (selfHeal) et le
  # HPA se battraient en remettant chacun leur valeur.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ecg-api.selectorLabels" . | nindent 6 }}
  template:
    {{- include "ecg-api.podTemplate" . | nindent 4 }}
{{- end }}
