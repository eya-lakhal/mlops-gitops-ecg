# Chaîne CI/CD : tests -> helm lint -> build -> scan Trivy -> push GHCR -> mise à jour GitOps.
# Les actions tierces sont épinglées par SHA de commit (immuable) et non par tag (déplaçable) :
# un tag compromis ne peut pas injecter de code dans la chaîne. Dependabot les met à jour.

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changer une valeur d'environnement ou l'infrastructure ne doit pas reconstruire l'image :
    # ArgoCD applique ces fichiers directement depuis Git.
    paths-ignore: ["**.md", "docs/**", "deploy/**", "infra/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, chaque job élargit seulement ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ecg-api
  PYTHON_VERSION: "3.11"
  TORCH_VERSION: "2.15.0"
  HELM_VERSION: "v4.3.2"

jobs:
  test:
    name: Tests Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances (torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,api,dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Tests (pytest)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -v

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint du chart (valeurs par défaut et valeurs dev)
        run: |
          helm lint charts/ecg-api --strict
          helm lint charts/ecg-api --strict -f deploy/envs/dev/values.yaml

      - name: Rendu des manifestes dev
        run: helm template ecg-api charts/ecg-api -f deploy/envs/dev/values.yaml

      # Le webhook d'admission de Prometheus Operator est désactivé en local : les règles SLO
      # sont donc validées ici, avant d'atteindre le cluster.
      - name: Validation des règles Prometheus (promtool)
        run: |
          helm template ecg-api charts/ecg-api -n ecg-dev -f deploy/envs/dev/values.yaml \
            --show-only templates/prometheusrule.yaml | yq '{"groups": .spec.groups}' > rules.yaml
          docker run --rm -v "$PWD:/w" --entrypoint promtool \
            quay.io/prometheus/prometheus:v3.16.0 check rules /w/rules.yaml

  build:
    name: Build, scan et push de l'image
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push vers GHCR
      security-events: write   # rapport Trivy dans l'onglet Security
      actions: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag immuable de l'image
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Métadonnées (tags et labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build (chargée localement pour le scan, pas encore poussée)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TORCH_VERSION=${{ env.TORCH_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Trivy (rapport SARIF complet)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Publier le rapport dans GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Barrière de sécurité (CRITICAL/HIGH corrigeables = échec)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          skip-setup-trivy: true

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (seulement si le scan est passé)
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "${IMAGE}"

  gitops:
    name: Mise à jour GitOps (dev)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # commit du nouveau tag dans le dépôt
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Écrire le nouveau tag dans deploy/envs/dev/values.yaml
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' deploy/envs/dev/values.yaml
          if git diff --quiet; then
            echo "Tag déjà à jour : rien à faire"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(gitops): ecg-api dev -> ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### Déploiement demandé : \`${TAG}\` (ArgoCD synchronisera le cluster)" >> "$GITHUB_STEP_SUMMARY"
