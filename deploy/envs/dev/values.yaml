# Environnement « dev » (cluster kind local), lu par ArgoCD en Phase 4.
# Source de vérité GitOps : ce que ce fichier décrit est ce qui doit tourner dans le cluster.

replicaCount: 1
image:
  # Mis à jour automatiquement par le job « gitops » de la CI à chaque push sur main.
  # Toujours un tag immuable (sha du commit), jamais « latest ».
  tag: "sha-25f1e5d"
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Observabilité (Phase 5) : scraping, SLO 99 % + alertes de burn rate, dashboard Grafana.
serviceMonitor:
  enabled: true
slo:
  enabled: true
dashboard:
  enabled: true
# Autoscaling (Phase 6) : de 2 à 5 Pods selon le CPU (le champ replicaCount est alors ignoré).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
# Déploiement progressif (Phase 7) : un Rollout canary avec analyse Prometheus remplace le Deployment.
rollout:
  enabled: true
# Chaos engineering : mettre "0.3" pour simuler 30 % d'erreurs, puis revenir à "0".
faultRate: "0"
