[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-mlops"
version = "0.1.0"
description = "Détection d'anomalies cardiaques sur ECG (MIT-BIH, CNN-BiLSTM) avec une chaîne MLOps complète"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.5",
]

[project.optional-dependencies]
train = [
    "wfdb>=4.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "mlflow>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
]
drift = [
    "evidently>=0.7.23,<0.8",
    # Evidently 0.7.23 importe une fonction interne retirée de pandas 3.
    "pandas>=2.2,<3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
